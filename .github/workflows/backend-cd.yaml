name: Backend Continuous Deployment

on:
  push:
    branches: [ "main" ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install Dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run Linter
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install Dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run Unit Tests
        working-directory: starter/backend
        run: pipenv run test

  build-and-deploy:
    name: Build, Push, and Deploy
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse AWS Credentials
        id: aws-creds
        env:
          AWS_JSON: ${{ secrets.AWS_CREDENTIALS }}
        run: |
          KEY_ID=$(echo "$AWS_JSON" | jq -r '(.aws_access_key_id // .["aws-access-key-id"] // .AccessKeyId)')
          SECRET_KEY=$(echo "$AWS_JSON" | jq -r '(.aws_secret_access_key // .["aws-secret-access-key"] // .SecretAccessKey)')
          TOKEN=$(echo "$AWS_JSON" | jq -r '(.aws_session_token // .["aws-session-token"] // .SessionToken)')
          
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$TOKEN"
          
          echo "aws_access_key_id=$KEY_ID" >> $GITHUB_OUTPUT
          echo "aws_secret_access_key=$SECRET_KEY" >> $GITHUB_OUTPUT
          echo "aws_session_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ steps.aws-creds.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ steps.aws-creds.outputs.aws_secret_access_key }}
          aws-session-token: ${{ steps.aws-creds.outputs.aws_session_token }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mp-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Deploy to Kubernetes Cluster
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mp-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/backend/k8s
          kustomize edit set image backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kustomize build | kubectl apply -f -